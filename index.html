<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GreenMind</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header>
      <div class="logo">
        <img src="icons/GreenMind.svg" alt="GreenMind" />
      </div>
      <nav>
        <ul>
          <li><a href="#" class="active">Home</a></li>
          <li><a href="#" class="nav-link">Products</a></li>
          <li><a href="#" class="nav-link">Contacts</a></li>
        </ul>
      </nav>
      <div class="icons">
        <a href="#"><img src="icons/Cart.svg" alt="Sepet" /></a>
        <a href="#"><img src="icons/Person.svg" alt="Profil" /></a>
        <img src="icons/Line 1.svg" alt="Ayırıcı" />
        <a href="#"><img src="icons/FilterRight.svg" alt="Menü" /></a>
      </div>
    </header>

    <section class="hero">
      <div class="hero-content">
        <p class="hero-title">
          Buy your <br />
          dream plants
        </p>

        <div class="stats-container">
          <div class="stat-item">
            <h3 class="stat-number">50+</h3>
            <p class="stat-desc">Plant Species</p>
          </div>
          <div class="divider"></div>
          <div class="stat-item">
            <h3 class="stat-number">100+</h3>
            <p class="stat-desc">Customers</p>
          </div>
        </div>

        <div class="search-container">
          <input type="text" placeholder="What are you looking for?" />
          <button class="search-btn">🔍</button>
        </div>
      </div>

      <div class="hero-image-area">
        <div class="black-shape"></div>
        <img src="icons/bitki-resmi.png" alt="Zamioculcas Plant" class="img-main" />
        <img src="icons/saksi-resmi.png" alt="Plant Pot" class="img-pot" />
      </div>
    </section>
  </body>
</html>
